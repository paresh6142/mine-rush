<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MINE RUSH</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:#090d13;

    color:white;

    font-family:Arial,sans-serif;
}

.app{

    max-width:480px;

    margin:auto;

    min-height:100vh;

    padding:18px;

}

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

}

.logo{

    font-size:24px;

    font-weight:800;

}

.user{

    color:#9da7b5;

    font-size:14px;

    margin-bottom:12px;

}

.card{

    background:#171d27;

    border:1px solid #293241;

    border-radius:20px;

    padding:20px;

    margin-bottom:12px;

}

.title{

    color:#9da7b5;

    font-size:12px;

}

.note{

    font-size:42px;

    font-weight:800;

    margin:8px 0;

}

.rupee{

    color:#9da7b5;

}

.stats{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:8px;

    margin-top:15px;

}

.stat{

    background:#0d131c;

    padding:13px 8px;

    border-radius:12px;

    text-align:center;

}

.stat-title{

    color:#8b96a5;

    font-size:10px;

}

.stat-value{

    font-size:17px;

    font-weight:bold;

    margin-top:5px;

}

.mine{

    text-align:center;

}

.mine-icon{

    font-size:70px;

    margin:15px;

}

.mine-button{

    width:180px;

    height:180px;

    border-radius:50%;

    border:0;

    background:#f5a623;

    font-size:24px;

    font-weight:bold;

    color:#111;

}

.status{

    color:#f5a623;

    margin-top:15px;

    font-size:13px;

}

.loading{

    position:fixed;

    inset:0;

    background:#090d13;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:100;

}

.spinner{

    width:45px;

    height:45px;

    border:4px solid #293241;

    border-top-color:#f5a623;

    border-radius:50%;

    animation:spin 1s linear infinite;

}

@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}

.error{

    display:none;

    position:fixed;

    inset:0;

    background:#090d13;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    padding:30px;

    z-index:101;

}

.error button{

    background:#f5a623;

    border:0;

    padding:12px 20px;

    border-radius:10px;

    font-weight:bold;

}

</style>

</head>


<body>


<div
    class="loading"
    id="loading"
>

    <div class="spinner"></div>

    <p>
        Connecting to MINE RUSH...
    </p>

</div>


<div
    class="error"
    id="error"
>

    <h2>⚠️ Connection Error</h2>

    <p id="errorText">
        Unable to connect.
    </p>

    <button onclick="loadUser()">
        TRY AGAIN
    </button>

</div>


<div
    class="app"
    id="app"
    style="display:none;"
>


    <div class="header">

        <div class="logo">
            🔥 MINE RUSH
        </div>

        <div>
            👤
        </div>

    </div>


    <div class="user">

        Welcome,

        <b id="username">
            Player
        </b>

    </div>


    <div class="card">


        <div class="title">
            MINE BALANCE
        </div>


        <div
            class="note"
            id="note"
        >
            0
        </div>


        <div class="rupee">

            ≈ ₹
            <span id="rupees">
                0.00
            </span>

        </div>


        <div class="stats">


            <div class="stat">

                <div class="stat-title">
                    🪙 NOTE
                </div>

                <div
                    class="stat-value"
                    id="noteSmall"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    🪙 SIKKA
                </div>

                <div
                    class="stat-value"
                    id="sikka"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    ⭐ LEVEL
                </div>

                <div
                    class="stat-value"
                    id="level"
                >
                    1
                </div>

            </div>


        </div>

    </div>


    <div class="card mine">


        <h2>
            ⛏️ MINING
        </h2>


        <div class="mine-icon">
            ⛏️
        </div>


        <button
            class="mine-button"
            onclick="notReady()"
        >

            MINE

        </button>


        <div class="status">

            Mining system will be
            activated next.

        </div>

    </div>


    <div class="card">


        <h3>
            ⚡ EXPERIENCE
        </h3>


        <div>

            XP:

            <b id="xp">
                0
            </b>

        </div>


    </div>


</div>


<script>


const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if(tg){

    tg.ready();

    tg.expand();

}


async function loadUser(){


    if(
        !tg ||
        !tg.initData
    ){

        showError(
            "MINE RUSH ko Telegram ke andar open karo."
        );

        return;

    }


    try{


        document.getElementById(
            "loading"
        ).style.display =
            "flex";


        document.getElementById(
            "error"
        ).style.display =
            "none";


        /*
         * Same Render domain:
         *
         * /app
         * /api/me
         *
         * No GitHub Pages.
         */

        const form =
            new URLSearchParams();


        form.append(
            "init_data",
            tg.initData
        );


        const response =
            await fetch(
                "/api/me",
                {

                    method:
                        "POST",

                    body:
                        form

                }
            );


        const data =
            await response.json();


        console.log(
            "MINE RUSH:",
            data
        );


        if(
            !response.ok ||
            !data.ok
        ){

            throw new Error(
                data.error ||
                "Authentication failed"
            );

        }


        const user =
            data.user;


        document.getElementById(
            "username"
        ).innerText =
            user.first_name ||
            user.username ||
            "Player";


        document.getElementById(
            "note"
        ).innerText =
            Number(
                user.note || 0
            ).toLocaleString();


        document.getElementById(
            "noteSmall"
        ).innerText =
            Number(
                user.note || 0
            ).toLocaleString();


        document.getElementById(
            "sikka"
        ).innerText =
            Number(
                user.sikka || 0
            ).toLocaleString();


        document.getElementById(
            "level"
        ).innerText =
            user.level || 1;


        document.getElementById(
            "xp"
        ).innerText =
            Number(
                user.xp || 0
            ).toLocaleString();


        document.getElementById(
            "rupees"
        ).innerText =
            (
                Number(
                    user.note || 0
                ) / 10000
            ).toFixed(2);


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "app"
        ).style.display =
            "block";


    }

    catch(error){

        console.error(
            error
        );


        showError(
            error.message ||
            "Connection failed"
        );

    }

}


function showError(
    message
){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "app"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "flex";


    document.getElementById(
        "errorText"
    ).innerText =
        message;

}


function notReady(){

    if(tg){

        tg.showAlert(
            "Mining system next step mein activate hoga."
        );

    }

}


loadUser();


</script>

</body>

</html>
