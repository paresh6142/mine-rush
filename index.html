<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>MINE RUSH</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
background:#070b12;
color:#fff;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 15% 10%,rgba(255,170,0,.13),transparent 28%),
radial-gradient(circle at 90% 20%,rgba(0,170,255,.10),transparent 30%),
radial-gradient(circle at 50% 100%,rgba(120,0,255,.10),transparent 35%);
}

.app{
position:relative;
max-width:520px;
margin:auto;
padding:14px 13px 95px;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.logo{
width:45px;
height:45px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
background:linear-gradient(145deg,#ffb300,#ff7900);
box-shadow:0 8px 25px #ff9d0030;
}

.title{
font-size:23px;
font-weight:800;
letter-spacing:.5px;
}

.online{
font-size:11px;
color:#00e08a;
background:#06271b;
border:1px solid #0a754d;
padding:6px 9px;
border-radius:20px;
}

.welcome{
color:#9aa7b7;
font-size:14px;
margin:3px 0 13px 3px;
}

.card{
background:linear-gradient(
145deg,
#111b28,
#0b121d
);
border:1px solid #243448;
border-radius:22px;
padding:15px;
margin-bottom:11px;
box-shadow:0 12px 35px #00000035;
}

.balance-head{
display:flex;
justify-content:space-between;
color:#8c9bad;
font-size:12px;
text-transform:uppercase;
}

.balance{
font-size:43px;
font-weight:800;
margin:2px 0;
}

.rupee{
color:#8e9aab;
font-size:13px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:12px;
}

.stat{
background:#070e18;
border:1px solid #1d2b3d;
border-radius:15px;
padding:9px 4px;
text-align:center;
}

.stat-icon{
font-size:18px;
}

.stat-label{
font-size:10px;
color:#8290a2;
margin-top:2px;
}

.stat-value{
font-size:16px;
font-weight:700;
margin-top:2px;
}

.mine-card{
padding:13px;
}

.mine-title{
display:flex;
align-items:center;
justify-content:space-between;
font-size:20px;
font-weight:700;
}

.energy{
font-size:11px;
color:#a9b4c2;
}

.mine-area{
display:flex;
align-items:center;
justify-content:space-around;
min-height:145px;
}

.pick{
font-size:70px;
filter:drop-shadow(0 10px 10px #000);
transform:rotate(-15deg);
}

.mine-btn{
width:135px;
height:135px;
border-radius:50%;
border:0;
font-size:20px;
font-weight:800;
background:linear-gradient(
145deg,
#ffb000,
#ff8500
);
box-shadow:
0 10px 0 #b85800,
0 20px 35px #ff9d0045;
}

.mine-btn:active{
transform:translateY(7px);
box-shadow:
0 3px 0 #b85800,
0 8px 18px #ff9d0040;
}

.mine-btn.active{
background:linear-gradient(
145deg,
#ffbf22,
#ff9200
);
}

.timer{
text-align:center;
font-size:28px;
font-weight:800;
letter-spacing:2px;
margin-top:3px;
}

.timer-label{
text-align:center;
font-size:11px;
color:#8d9aaa;
}

.progress{
height:7px;
background:#050a11;
border-radius:10px;
overflow:hidden;
margin-top:11px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#00d98b,
#00a9ff
);
transition:width .4s;
}

.mine-info{
display:flex;
justify-content:space-between;
font-size:11px;
color:#8996a7;
margin-top:6px;
}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.feature{
background:#111b28;
border:1px solid #253449;
border-radius:17px;
padding:13px 5px;
color:#fff;
font-size:11px;
font-weight:700;
}

.feature span{
display:block;
font-size:22px;
margin-bottom:5px;
}

.feature:active{
transform:scale(.97);
}

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
background:#09101aee;
backdrop-filter:blur(15px);
border-top:1px solid #203044;
padding:8px 10px calc(8px + env(safe-area-inset-bottom));
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:50;
}

.nav{
border:0;
background:transparent;
color:#768598;
font-size:10px;
padding:5px;
}

.nav span{
display:block;
font-size:20px;
margin-bottom:2px;
}

.nav.active{
color:#ffae00;
}

.modal{
position:fixed;
inset:0;
background:#0009;
display:none;
align-items:flex-end;
z-index:100;
}

.modal.show{
display:flex;
}

.sheet{
width:100%;
max-width:520px;
margin:auto;
background:#101925;
border:1px solid #293a4e;
border-radius:25px 25px 0 0;
padding:18px;
max-height:80vh;
overflow:auto;
}

.sheet h2{
margin:0 0 15px;
font-size:20px;
}

.close{
float:right;
border:0;
background:#202d3d;
color:#fff;
border-radius:10px;
padding:7px 11px;
}

.row{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #1d2a38;
font-size:13px;
}

.primary{
width:100%;
border:0;
border-radius:14px;
padding:14px;
font-size:15px;
font-weight:800;
background:#ff9d00;
color:#111;
margin-top:12px;
}

.input{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid #2a3a4d;
background:#080e16;
color:#fff;
margin-top:8px;
outline:none;
}

.loading{
position:fixed;
inset:0;
background:#070b12;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
font-size:18px;
}

.hidden{
display:none!important;
}

.toast{
position:fixed;
left:50%;
bottom:85px;
transform:translateX(-50%);
background:#172334;
border:1px solid #30445d;
padding:11px 16px;
border-radius:13px;
font-size:12px;
z-index:200;
display:none;
}

</style>

</head>

<body>

<div id="loading" class="loading">
⛏️ Loading MINE RUSH...
</div>


<div class="app">

<div class="top">

<div class="brand">

<div class="logo">⛏️</div>

<div class="title">
MINE RUSH
</div>

</div>

<div class="online">
● ONLINE
</div>

</div>


<div class="welcome">
Welcome, <b id="username">Gamer</b> 👋
</div>


<!-- BALANCE -->

<div class="card">

<div class="balance-head">

<span>MINE BALANCE</span>

<span id="boostText">
+0%
</span>

</div>

<div class="balance" id="note">
0
</div>

<div class="rupee">
≈ ₹<span id="rupees">0.00</span>
</div>


<div class="stats">

<div class="stat">

<div class="stat-icon">🪙</div>

<div class="stat-label">
NOTE
</div>

<div class="stat-value" id="note2">
0
</div>

</div>


<div class="stat">

<div class="stat-icon">🪙</div>

<div class="stat-label">
SIKKA
</div>

<div class="stat-value" id="sikka">
0
</div>

</div>


<div class="stat">

<div class="stat-icon">⭐</div>

<div class="stat-label">
LEVEL
</div>

<div class="stat-value" id="level">
1
</div>

</div>

</div>

</div>


<!-- MINING -->

<div class="card mine-card">

<div class="mine-title">

<span>⛏️ MINING</span>

<span class="energy">
⚡ <span id="energy">100</span>/100
</span>

</div>


<div class="mine-area">

<div class="pick">
⛏️
</div>

<button
id="mineBtn"
class="mine-btn"
onclick="miningAction()"
>
START
</button>

</div>


<div
id="timer"
class="timer"
>
04:00:00
</div>

<div
id="timerLabel"
class="timer-label"
>
Start a 4-hour mining session
</div>


<div class="progress">

<div
id="progress"
class="progress-bar"
>
</div>

</div>


<div class="mine-info">

<span>
+<span id="reward">100</span> NOTE
</span>

<span>
4 HOURS
</span>

</div>

</div>


<!-- FEATURES -->

<div class="features">

<button
class="feature"
onclick="openBonus()"
>
<span>🎁</span>
BONUS
</button>


<button
class="feature"
onclick="openReferral()"
>
<span>👥</span>
REFER
</button>


<button
class="feature"
onclick="openLeaderboard()"
>
<span>🏆</span>
RANK
</button>


<button
class="feature"
onclick="openWallet()"
>
<span>💰</span>
WALLET
</button>


<button
class="feature"
onclick="openProfile()"
>
<span>👤</span>
PROFILE
</button>


<button
class="feature"
onclick="showSoon()"
>
<span>🛒</span>
MARKET
</button>

</div>

</div>


<!-- BOTTOM -->

<div class="bottom">

<button
class="nav active"
onclick="scrollTopPage()"
>
<span>🏠</span>
HOME
</button>

<button
class="nav"
onclick="focusMining()"
>
<span>⛏️</span>
MINING
</button>

<button
class="nav"
onclick="openWallet()"
>
<span>💰</span>
WALLET
</button>

<button
class="nav"
onclick="openProfile()"
>
<span>👤</span>
PROFILE
</button>

</div>


<!-- MODAL -->

<div
id="modal"
class="modal"
onclick="closeOutside(event)"
>

<div class="sheet">

<button
class="close"
onclick="closeModal()"
>
✕
</button>

<div id="modalContent"></div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

const tg =
window.Telegram &&
window.Telegram.WebApp
? window.Telegram.WebApp
: null;


if(tg){

tg.ready();

tg.expand();

try{
tg.setHeaderColor("#070b12");
tg.setBackgroundColor("#070b12");
}catch(e){}

}


const API = "";

let user = null;

let timerInterval = null;


function initData(){

if(tg && tg.initData){
return tg.initData;
}

return "";

}


async function api(
url,
options={}
){

const headers =
options.headers || {};

headers[
"X-Telegram-Init-Data"
] = initData();

headers[
"Content-Type"
] = "application/json";


const response =
await fetch(
API + url,
{
...options,
headers
}
);


const text =
await response.text();


let data;

try{

data =
JSON.parse(text);

}catch(e){

throw new Error(
"Server returned invalid response"
);

}


if(!response.ok){

throw new Error(
data.error ||
"Request failed"
);

}


return data;

}


function money(n){

return Number(n || 0)
.toFixed(2);

}


function showToast(text){

const el =
document.getElementById(
"toast"
);

el.innerText = text;

el.style.display =
"block";


setTimeout(
()=>{
el.style.display="none";
},
2500
);

}


function updateUI(){

if(!user) return;


document.getElementById(
"username"
).innerText =
user.username || "Gamer";


document.getElementById(
"note"
).innerText =
Number(user.note || 0)
.toLocaleString();


document.getElementById(
"note2"
).innerText =
Number(user.note || 0)
.toLocaleString();


document.getElementById(
"sikka"
).innerText =
Number(user.sikka || 0)
.toLocaleString();


document.getElementById(
"level"
).innerText =
user.level || 1;


document.getElementById(
"energy"
).innerText =
user.energy ?? 100;


document.getElementById(
"boostText"
).innerText =
"+" +
Number(user.boost || 0)
.toFixed(0)
+
"%";


document.getElementById(
"reward"
).innerText =
Number(user.mining_rate || 100)
.toFixed(0);


document.getElementById(
"rupees"
).innerText =
money(
Number(user.note || 0) / 10000
);


updateMiningUI();

}


function updateMiningUI(){

if(!user) return;


const btn =
document.getElementById(
"mineBtn"
);

const timer =
document.getElementById(
"timer"
);

const label =
document.getElementById(
"timerLabel"
);

const progress =
document.getElementById(
"progress"
);


if(timerInterval){

clearInterval(
timerInterval
);

timerInterval = null;

}


const ends =
user.mining_ends_at;


if(!ends){

btn.innerText =
"START";

btn.classList.remove(
"active"
);

timer.innerText =
"04:00:00";

label.innerText =
"Start a 4-hour mining session";

progress.style.width =
"0%";

return;

}


const end =
new Date(ends)
.getTime();


const start =
user.mining_started_at
? new Date(
user.mining_started_at
).getTime()
: end -
4*60*60*1000;


function tick(){

const now =
Date.now();


let remaining =
Math.max(
0,
end-now
);


const total =
4*60*60*1000;


const passed =
Math.min(
total,
Math.max(
0,
now-start
)
);


const percent =
Math.min(
100,
passed/total*100
);


progress.style.width =
percent + "%";


if(remaining <= 0){

timer.innerText =
"READY";

label.innerText =
"Mining complete — claim your reward";

btn.innerText =
"CLAIM";

btn.classList.add(
"active"
);

clearInterval(
timerInterval
);

return;

}


const seconds =
Math.floor(
remaining/1000
);


const h =
Math.floor(
seconds/3600
);

const m =
Math.floor(
(seconds%3600)/60
);

const s =
seconds%60;


timer.innerText =
String(h).padStart(2,"0")
+
":"
+
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");


label.innerText =
"Mining in progress...";


btn.innerText =
"MINE";

btn.classList.add(
"active"
);

}


tick();

timerInterval =
setInterval(
tick,
1000
);

}


async function miningAction(){

try{

if(
user &&
user.mining_ends_at
){

const end =
new Date(
user.mining_ends_at
).getTime();


if(
Date.now() >= end
){

const data =
await api(
"/api/mining/claim",
{
method:"POST"
}
);


user =
data.user;

updateUI();

showToast(
"🎉 +" +
data.reward +
" NOTE received!"
);

return;

}


showToast(
"⛏️ Mining already running"
);

return;

}


const data =
await api(
"/api/mining/start",
{
method:"POST"
}
);


user =
data.user;

updateUI();

showToast(
"⛏️ 4-hour mining started!"
);


}catch(e){

showToast(
"⚠️ " + e.message
);

}

}


async function openBonus(){

openModal(
"<h2>🎁 Daily Bonus</h2>" +
"<div class='row'>" +
"<span>Today's reward</span>" +
"<b>+100 SIKKA</b>" +
"</div>" +
"<button class='primary' onclick='claimBonus()'>CLAIM BONUS</button>"
);

}


async function claimBonus(){

try{

const data =
await api(
"/api/bonus",
{
method:"POST"
}
);


user =
data.user;

updateUI();

closeModal();

showToast(
"🎁 +100 SIKKA!"
);


}catch(e){

showToast(
"⚠️ " + e.message
);

}

}


async function openReferral(){

openModal(
"<h2>👥 Referral</h2>" +
"<p>Invite friends and earn <b>50 SIKKA</b>.</p>" +
"<div class='row'><span>Loading...</span></div>"
);


try{

const data =
await api(
"/api/referral",
{
method:"POST"
}
);


document.getElementById(
"modalContent"
).innerHTML =

"<h2>👥 Referral</h2>" +

"<div class='row'>" +
"<span>Your code</span>" +
"<b>" +
data.code +
"</b>" +
"</div>" +

"<div class='row'>" +
"<span>Referrals</span>" +
"<b>" +
data.count +
"</b>" +
"</div>" +

"<input " +
"class='input' " +
"id='refLink' " +
"value='" +
data.link +
"' " +
"readonly>" +

"<button class='primary' onclick='copyReferral()'>" +
"📋 COPY LINK" +
"</button>";

window.referralLink =
data.link;


}catch(e){

showToast(
"⚠️ " + e.message
);

}

}


async function copyReferral(){

try{

await navigator.clipboard.writeText(
window.referralLink
);

showToast(
"✅ Referral link copied"
);

}catch(e){

showToast(
"Copy failed"
);

}

}


async function openLeaderboard(){

openModal(
"<h2>🏆 Leaderboard</h2>" +
"<div id='leaderboard'>Loading...</div>"
);


try{

const data =
await api(
"/api/leaderboard",
{
method:"POST"
}
);


let html = "";


data.leaderboard
.forEach(
(row,i)=>{

let medal =
"🔹";

if(i===0) medal="🥇";

if(i===1) medal="🥈";

if(i===2) medal="🥉";


html +=

"<div class='row'>" +

"<span>" +
medal +
" " +
(i+1) +
". " +
(row.username || "Gamer") +
"</span>" +

"<b>" +
Number(
row.note_balance || 0
).toFixed(0) +
" NOTE</b>" +

"</div>";

}
);


document.getElementById(
"leaderboard"
).innerHTML =
html || "No players yet.";


}catch(e){

showToast(
"⚠️ " + e.message
);

}

}


async function openWallet(){

openModal(
"<h2>💰 Wallet</h2>" +
"<div class='row'>" +
"<span>NOTE</span>" +
"<b id='walletNote'>Loading...</b>" +
"</div>" +
"<div class='row'>" +
"<span>SIKKA</span>" +
"<b id='walletSikka'>Loading...</b>" +
"</div>" +
"<button class='primary' onclick='showSoon()'>💸 WITHDRAW</button>"
);


try{

const data =
await api(
"/api/wallet",
{
method:"POST"
}
);


document.getElementById(
"walletNote"
).innerText =
Number(
data.user.note || 0
).toLocaleString();


document.getElementById(
"walletSikka"
).innerText =
Number(
data.user.sikka || 0
).toLocaleString();


}catch(e){

showToast(
"⚠️ " + e.message
);

}

}


function openProfile(){

openModal(

"<h2>👤 Profile</h2>" +

"<div class='row'>" +
"<span>Username</span>" +
"<b>" +
(user.username || "Gamer") +
"</b>" +
"</div>" +

"<div class='row'>" +
"<span>Level</span>" +
"<b>" +
user.level +
"</b>" +
"</div>" +

"<div class='row'>" +
"<span>XP</span>" +
"<b>" +
user.xp +
"</b>" +
"</div>" +

"<div class='row'>" +
"<span>Referrals</span>" +
"<b>" +
user.referral_count +
"</b>" +
"</div>"

);

}


function showSoon(){

showToast(
"🚧 Coming soon"
);

}


function openModal(html){

document.getElementById(
"modalContent"
).innerHTML =
html;

document.getElementById(
"modal"
).classList.add(
"show"
);

}


function closeModal(){

document.getElementById(
"modal"
).classList.remove(
"show"
);

}


function closeOutside(e){

if(
e.target.id === "modal"
){

closeModal();

}

}


function focusMining(){

document.querySelector(
".mine-card"
).scrollIntoView({
behavior:"smooth",
block:"center"
});

}


function scrollTopPage(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}


async function load(){

try{

if(
!tg ||
!tg.initData
){

throw new Error(
"Open MINE RUSH from Telegram"
);

}


const data =
await api(
"/api/me",
{
method:"POST"
}
);


if(!data.ok){

throw new Error(
data.error ||
"Unable to load account"
);

}


user =
data.user;


updateUI();


document.getElementById(
"loading"
).classList.add(
"hidden"
);


}catch(e){

console.error(e);

document.getElementById(
"loading"
).innerHTML =

"⚠️<br><br>" +

e.message +

"<br><br>" +

"<button " +
"onclick='location.reload()' " +
"style='padding:12px 20px;border:0;border-radius:12px;background:#ff9d00;font-weight:bold'>" +

"TRY AGAIN" +

"</button>";

}

}


load();

</script>

</body>
</html>
