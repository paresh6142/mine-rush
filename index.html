<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MINE RUSH</title>

<style>
:root{
  --bg:#050b12;
  --card:#0c1724;
  --card2:#101f2f;
  --line:#20364c;
  --gold:#ffb300;
  --orange:#ff8500;
  --green:#00d98b;
  --red:#ff5757;
  --text:#f7f9fc;
  --muted:#8798aa;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:14px 14px 90px;
  background:
    radial-gradient(circle at 50% -10%,#173953 0,#07101a 42%,#050b12 75%);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.app{
  max-width:680px;
  margin:auto;
}

button{
  font:inherit;
  cursor:pointer;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#ffc21a,#ed7900);
  font-size:25px;
}

.brand h1{
  margin:0;
  font-size:23px;
}

.welcome{
  margin-top:3px;
  color:var(--muted);
  font-size:13px;
}

.online{
  color:var(--green);
  border:1px solid #00d98b55;
  padding:7px 10px;
  border-radius:20px;
  font-size:11px;
}

/* CARDS */

.card{
  margin:11px 0;
  padding:16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(145deg,var(--card),#09131f);
  box-shadow:0 10px 30px #0006;
}

.label{
  color:var(--muted);
  font-size:12px;
}

.balance{
  margin-top:5px;
  font-size:45px;
  font-weight:900;
}

.rupee{
  color:var(--green);
  font-size:14px;
  margin-top:4px;
}

.balanceStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat{
  padding:10px 5px;
  text-align:center;
  border-radius:14px;
  background:#07111c;
  border:1px solid #1c3044;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

.stat b{
  font-size:15px;
}

/* MINING */

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:800;
}

.energy{
  color:var(--gold);
  font-size:12px;
}

.mineArea{
  text-align:center;
  padding:20px 0 10px;
}

.pick{
  font-size:62px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  50%{transform:translateY(-7px) rotate(-5deg)}
}

.mineButton{
  width:145px;
  height:145px;
  border:0;
  border-radius:50%;
  background:linear-gradient(145deg,#ffc21a,#ff8500);
  color:#111;
  font-size:22px;
  font-weight:900;
  box-shadow:
    inset 0 -9px 0 #d96c00,
    0 15px 35px #ff980044;
}

.mineButton:active{
  transform:scale(.95);
}

.mineButton:disabled{
  opacity:.55;
}

.timer{
  margin-top:8px;
  text-align:center;
  font-size:29px;
  font-weight:900;
}

.miningInfo{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.progress{
  height:8px;
  margin-top:14px;
  background:#050c14;
  border-radius:10px;
  overflow:hidden;
}

.progressBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff8500,#ffd21a);
  transition:.3s;
}

.mineMeta{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}

/* MINERS */

.titleRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.titleRow h2{
  margin:0;
  font-size:20px;
}

.view{
  color:var(--gold);
  font-size:11px;
}

.miner{
  padding:13px;
  margin-top:9px;
  border:1px solid var(--line);
  background:#091522;
  border-radius:16px;
}

.minerTop{
  display:flex;
  align-items:center;
  gap:11px;
}

.minerIcon{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:#13263a;
  font-size:25px;
}

.minerInfo{
  flex:1;
}

.minerInfo b{
  font-size:15px;
}

.minerInfo small{
  display:block;
  color:var(--muted);
  margin-top:4px;
  font-size:11px;
}

.minerBottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.earning{
  color:var(--green);
  font-size:12px;
}

.buy{
  border:0;
  border-radius:10px;
  padding:8px 13px;
  background:linear-gradient(90deg,#ff9500,#ffc21a);
  color:#111;
  font-weight:800;
  font-size:11px;
}

/* FEATURES */

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.feature{
  padding:13px 5px;
  text-align:center;
  border-radius:15px;
  border:1px solid var(--line);
  background:#091522;
}

.featureIcon{
  font-size:24px;
}

.feature b{
  display:block;
  color:var(--gold);
  margin-top:6px;
  font-size:11px;
}

/* NAV */

.nav{
  position:fixed;
  z-index:10;
  bottom:7px;
  left:50%;
  transform:translateX(-50%);
  width:min(650px,calc(100% - 14px));
  padding:6px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:#07111df5;
  border:1px solid #22374e;
  border-radius:20px;
}

.nav button{
  border:0;
  background:none;
  color:#7f91a4;
  font-size:9px;
}

.nav i{
  display:block;
  font-style:normal;
  font-size:19px;
  margin-bottom:2px;
}

.nav .active{
  color:var(--gold);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:flex-end;
  background:#000b;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(680px,100%);
  max-height:82vh;
  overflow:auto;
  margin:auto;
  padding:17px;
  border-radius:22px 22px 0 0;
  background:#091521;
  border:1px solid #263c53;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#17293c;
  color:white;
  font-size:22px;
}

.modalRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #1c2d40;
}

.modalRow span{
  color:var(--muted);
}

.action{
  width:100%;
  border:0;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  background:linear-gradient(90deg,#ff9500,#ffc21a);
  color:#111;
  font-weight:900;
}

.note{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

@media(max-width:430px){
  .balance{font-size:41px}
  .mineButton{
    width:135px;
    height:135px;
  }
  .features{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="top">
    <div class="brand">
      <div class="logo">⛏️</div>
      <div>
        <h1>MINE RUSH</h1>
        <div class="welcome">
          Welcome, <b id="username">Gamer</b> 👋
        </div>
      </div>
    </div>

    <div class="online">● ONLINE</div>
  </div>


  <!-- BALANCE -->
  <div class="card">

    <div class="label">TOTAL NOTE</div>

    <div class="balance" id="note">
      0
    </div>

    <div class="rupee">
      ≈ ₹<span id="rupee">0.00</span>
    </div>

    <div class="balanceStats">

      <div class="stat">
        🪙
        <small>SIKKA</small>
        <b id="sikka">0</b>
      </div>

      <div class="stat">
        ⭐
        <small>LEVEL</small>
        <b id="level">1</b>
      </div>

      <div class="stat">
        ⚡
        <small>XP</small>
        <b id="xp">0</b>
      </div>

    </div>

  </div>


  <!-- MINING -->
  <div class="card">

    <div class="sectionTitle">
      <span>⛏️ MINING</span>
      <span class="energy">
        ⚡ <span id="energy">100</span>/100
      </span>
    </div>

    <div class="mineArea">

      <div class="pick">⛏️</div>

      <button
        class="mineButton"
        id="mineButton"
        onclick="startMining()">
        START
      </button>

    </div>

    <div class="timer" id="timer">
      READY
    </div>

    <div class="miningInfo" id="miningInfo">
      Select a miner to start earning
    </div>

    <div class="progress">
      <div
        class="progressBar"
        id="progressBar">
      </div>
    </div>

    <div class="mineMeta">
      <span id="mineReward">+0 NOTE</span>
      <span id="mineDuration">--</span>
    </div>

  </div>


  <!-- MINERS -->
  <div class="card">

    <div class="titleRow">
      <h2>👷 MINERS</h2>
      <span class="view">MY MINERS</span>
    </div>

    <div id="minerList"></div>

  </div>


  <!-- FEATURES -->
  <div class="card">

    <div class="titleRow">
      <h2>MORE</h2>
    </div>

    <div class="features">

      <div class="feature" onclick="wallet()">
        <div class="featureIcon">💰</div>
        <b>WALLET</b>
      </div>

      <div class="feature" onclick="market()">
        <div class="featureIcon">🛒</div>
        <b>MARKET</b>
      </div>

      <div class="feature" onclick="bonus()">
        <div class="featureIcon">🎁</div>
        <b>BONUS</b>
      </div>

      <div class="feature" onclick="referral()">
        <div class="featureIcon">👥</div>
        <b>REFERRAL</b>
      </div>

      <div class="feature" onclick="leaderboard()">
        <div class="featureIcon">🏆</div>
        <b>RANK</b>
      </div>

      <div class="feature" onclick="profile()">
        <div class="featureIcon">👤</div>
        <b>PROFILE</b>
      </div>

    </div>

  </div>

</div>


<!-- NAVIGATION -->
<div class="nav">

  <button class="active">
    <i>🏠</i>
    HOME
  </button>

  <button onclick="scrollToMining()">
    <i>⛏️</i>
    MINING
  </button>

  <button onclick="wallet()">
    <i>💰</i>
    WALLET
  </button>

  <button onclick="market()">
    <i>🛒</i>
    MARKET
  </button>

  <button onclick="profile()">
    <i>👤</i>
    PROFILE
  </button>

</div>


<!-- MODAL -->
<div
  class="modal"
  id="modal"
  onclick="if(event.target===this)closeModal()">

  <div class="sheet">

    <div class="modalHead">
      <span id="modalTitle"></span>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>
    </div>

    <div id="modalBody"></div>

  </div>

</div>


<script>

/* =====================================================
   MINE RUSH NEW ECONOMY
   1000 NOTE = ₹1
===================================================== */

const NOTE_PER_RUPEE = 1000;


/* PLAYER */

let player = {
  username:"Gamer",
  note:0,
  sikka:0,
  xp:0,
  level:1,
  energy:100,

  mining:false,
  miningEnd:null,
  miningReward:0,
  miningDuration:0,

  miners:[]
};


/* =====================================================
   MINERS

   Prices are INR.
   Earnings are NOTE.

   Example:
   ₹10 miner = 10,000 NOTE price
===================================================== */

const MINERS = [

  {
    id:"stone",
    name:"Stone Miner",
    icon:"⛏️",
    price:10,
    reward:1000,
    duration:3600
  },

  {
    id:"iron",
    name:"Iron Miner",
    icon:"👷",
    price:50,
    reward:6000,
    duration:3600
  },

  {
    id:"gold",
    name:"Gold Miner",
    icon:"🥇",
    price:250,
    reward:35000,
    duration:3600
  },

  {
    id:"diamond",
    name:"Diamond Miner",
    icon:"💎",
    price:1000,
    reward:160000,
    duration:3600
  }

];


/* =====================================================
   HELPERS
===================================================== */

function $(id){
  return document.getElementById(id);
}


function save(){

  localStorage.setItem(
    "mine_rush_new",
    JSON.stringify(player)
  );

}


function load(){

  const saved =
    localStorage.getItem("mine_rush_new");

  if(saved){

    try{
      player = {
        ...player,
        ...JSON.parse(saved)
      };
    }catch(e){}

  }

}


function format(n){

  return Number(n || 0)
    .toLocaleString("en-IN");

}


function rupees(note){

  return (
    Number(note || 0) /
    NOTE_PER_RUPEE
  ).toFixed(2);

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  $("username").textContent =
    player.username || "Gamer";

  $("note").textContent =
    format(player.note);

  $("rupee").textContent =
    rupees(player.note);

  $("sikka").textContent =
    format(player.sikka);

  $("xp").textContent =
    format(player.xp);

  $("level").textContent =
    player.level;

  $("energy").textContent =
    player.energy;

  renderMiners();

  renderMining();

}


/* =====================================================
   MINER LIST
===================================================== */

function renderMiners(){

  const box =
    $("minerList");

  box.innerHTML = "";

  MINERS.forEach(miner => {

    const owned =
      player.miners.includes(miner.id);

    const div =
      document.createElement("div");

    div.className = "miner";

    div.innerHTML = `

      <div class="minerTop">

        <div class="minerIcon">
          ${miner.icon}
        </div>

        <div class="minerInfo">

          <b>${miner.name}</b>

          <small>
            ₹${miner.price}
            •
            ${format(miner.reward)} NOTE / hour
          </small>

        </div>

      </div>

      <div class="minerBottom">

        <span class="earning">
          +${format(miner.reward)} NOTE
        </span>

        ${
          owned

          ?

          `<button
             class="buy"
             onclick="selectMiner('${miner.id}')">
             SELECT
           </button>`

          :

          `<button
             class="buy"
             onclick="buyMiner('${miner.id}')">
             BUY ₹${miner.price}
           </button>`
        }

      </div>
    `;

    box.appendChild(div);

  });

}


/* =====================================================
   BUY MINER
===================================================== */

function buyMiner(id){

  const miner =
    MINERS.find(x => x.id === id);

  if(!miner) return;


  const priceNote =
    miner.price * NOTE_PER_RUPEE;


  if(player.note < priceNote){

    alert(
      `Need ${format(priceNote)} NOTE (₹${miner.price})`
    );

    return;

  }


  player.note -= priceNote;

  player.miners.push(id);

  save();
  render();

  alert(
    `${miner.name} purchased successfully!`
  );

}


/* =====================================================
   SELECT MINER
===================================================== */

function selectMiner(id){

  const miner =
    MINERS.find(x => x.id === id);

  if(!miner) return;

  startMining(miner);

}


/* =====================================================
   START MINING
===================================================== */

function startMining(miner){

  if(!miner){

    if(player.miners.length === 0){

      alert(
        "First buy a miner."
      );

      return;
    }

    miner =
      MINERS.find(
        x => x.id === player.miners[0]
      );

  }


  if(player.mining){

    alert(
      "Mining is already running."
    );

    return;

  }


  player.mining = true;

  player.miningDuration =
    miner.duration * 1000;

  player.miningEnd =
    Date.now() +
    player.miningDuration;

  player.miningReward =
    miner.reward;

  save();

  render();

}


/* =====================================================
   MINING TIMER
===================================================== */

function renderMining(){

  if(!player.mining){

    $("timer").textContent =
      "READY";

    $("miningInfo").textContent =
      player.miners.length
      ? "Select your miner to start earning"
      : "Buy a miner to start earning";

    $("mineButton").textContent =
      "START";

    $("mineButton").disabled =
      player.miners.length === 0;

    $("progressBar").style.width =
      "0%";

    $("mineReward").textContent =
      "+0 NOTE";

    $("mineDuration").textContent =
      "--";

    return;

  }


  const remaining =
    Math.max(
      0,
      player.miningEnd -
      Date.now()
    );


  if(remaining <= 0){

    finishMining();

    return;

  }


  const seconds =
    Math.floor(
      remaining / 1000
    );


  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;


  $("timer").textContent =
    `${String(h).padStart(2,"0")}:` +
    `${String(m).padStart(2,"0")}:` +
    `${String(s).padStart(2,"0")}`;


  $("miningInfo").textContent =
    "Mining in progress...";


  $("mineButton").textContent =
    "RUNNING";

  $("mineButton").disabled =
    true;


  const total =
    player.miningDuration;

  const progress =
    100 -
    (remaining / total * 100);


  $("progressBar").style.width =
    Math.min(
      100,
      Math.max(0,progress)
    ) + "%";


  $("mineReward").textContent =
    "+" +
    format(player.miningReward) +
    " NOTE";


  $("mineDuration").textContent =
    "1 HOUR";

}


/* =====================================================
   FINISH MINING
===================================================== */

function finishMining(){

  player.note +=
    Number(player.miningReward);

  player.xp +=
    10;

  checkLevel();


  player.mining =
    false;

  player.miningEnd =
    null;

  player.miningReward =
    0;

  player.miningDuration =
    0;


  save();
  render();

  alert(
    "⛏️ Mining complete! Reward added."
  );

}


/* =====================================================
   LEVEL
===================================================== */

function checkLevel(){

  const newLevel =
    Math.floor(
      player.xp / 100
    ) + 1;

  if(newLevel > player.level){

    player.level =
      newLevel;

    alert(
      `🎉 Level ${player.level} reached!`
    );

  }

}


/* =====================================================
   MODAL
===================================================== */

function openModal(title,body){

  $("modalTitle").textContent =
    title;

  $("modalBody").innerHTML =
    body;

  $("modal").classList.add("show");

}


function closeModal(){

  $("modal")
    .classList
    .remove("show");

}


/* =====================================================
   WALLET
===================================================== */

function wallet(){

  openModal(
    "💰 WALLET",

    `
      <div class="modalRow">
        <span>NOTE</span>
        <b>${format(player.note)}</b>
      </div>

      <div class="modalRow">
        <span>Value</span>
        <b>₹${rupees(player.note)}</b>
      </div>

      <div class="modalRow">
        <span>SIKKA</span>
        <b>${format(player.sikka)}</b>
      </div>

      <p class="note">
        Conversion rate:
        1,000 NOTE = ₹1
      </p>

      <button
        class="action"
        onclick="withdraw()">
        WITHDRAW
      </button>
    `
  );

}


/* =====================================================
   WITHDRAW
===================================================== */

function withdraw(){

  if(player.note < 10000){

    alert(
      "Minimum withdrawal is 10,000 NOTE (₹10)."
    );

    return;

  }

  alert(
    "Withdrawal backend will be connected next."
  );

}


/* =====================================================
   MARKET
===================================================== */

function market(){

  openModal(

    "🛒 MARKET",

    `
      <div class="modalRow">
        <span>100 SIKKA</span>
        <b>1,000 NOTE</b>
      </div>

      <div class="modalRow">
        <span>Mining Boost</span>
        <b>500 SIKKA</b>
      </div>

      <div class="modalRow">
        <span>Energy Pack</span>
        <b>250 SIKKA</b>
      </div>

      <p class="note">
        Market items will be connected
        to the server economy.
      </p>
    `

  );

}


/* =====================================================
   BONUS
===================================================== */

function bonus(){

  openModal(

    "🎁 DAILY BONUS",

    `
      <div class="modalRow">
        <span>Daily Reward</span>
        <b>100 SIKKA</b>
      </div>

      <button
        class="action"
        onclick="claimBonus()">
        CLAIM BONUS
      </button>
    `

  );

}


function claimBonus(){

  player.sikka += 100;

  save();
  render();
  closeModal();

  alert(
    "🎁 +100 SIKKA"
  );

}


/* =====================================================
   REFERRAL
===================================================== */

function referral(){

  openModal(

    "👥 REFERRAL",

    `
      <div class="modalRow">
        <span>Referral Reward</span>
        <b>500 SIKKA</b>
      </div>

      <p class="note">
        Invite players and earn SIKKA
        when they complete the required
        referral conditions.
      </p>

      <button
        class="action"

  );

}
